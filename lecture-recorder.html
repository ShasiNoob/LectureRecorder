<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>講義レコーダー</title>
<style>
  :root {
    --bg: #0d0d10;
    --surface: #16161c;
    --surface2: #1e1e26;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0ede8;
    --text2: rgba(240,237,232,0.5);
    --text3: rgba(240,237,232,0.25);
    --red: #e63946;
    --red-glow: rgba(230,57,70,0.35);
    --green: #4ade80;
    --amber: #fbbf24;
    --blue: #60a5fa;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  .app {
    width: 100%;
    max-width: 500px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-bottom: 40px;
  }

  /* ── Header ── */
  header {
    padding: 20px 20px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 0.5px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .logo {
    width: 36px; height: 36px;
    background: var(--red);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: 0 2px 12px var(--red-glow);
  }

  header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .header-date {
    margin-left: auto;
    font-size: 12px;
    color: var(--text2);
  }

  /* ── Lang tabs ── */
  .lang-row {
    margin: 16px 20px 0;
    display: flex;
    gap: 8px;
  }

  .lang-btn {
    padding: 7px 14px;
    border-radius: 20px;
    border: 0.5px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.18s;
    touch-action: manipulation;
  }
  .lang-btn.active {
    background: rgba(230,57,70,0.12);
    border-color: rgba(230,57,70,0.45);
    color: #ff7a85;
  }

  /* ── Status ── */
  .status-card {
    margin: 14px 20px 0;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: all 0.3s;
  }
  .dot.idle    { background: rgba(255,255,255,0.18); }
  .dot.rec     { background: var(--red); box-shadow: 0 0 10px var(--red-glow); animation: blink 1.2s ease-in-out infinite; }
  .dot.paused  { background: var(--amber); box-shadow: 0 0 8px rgba(251,191,36,0.4); }
  .dot.proc    { background: var(--blue); animation: blink 0.8s ease-in-out infinite; }

  @keyframes blink {
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.4; transform:scale(0.8); }
  }

  .status-info { flex: 1; }
  .status-label { font-size: 14px; font-weight: 500; }
  .status-sub   { font-size: 12px; color: var(--text2); margin-top: 2px; }

  .timer {
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--red);
    letter-spacing: 0.06em;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .timer.show { opacity: 1; }

  /* ── Waveform ── */
  .waveform {
    margin: 14px 20px 0;
    height: 56px;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 0 14px;
    overflow: hidden;
  }

  .waveform .hint {
    font-size: 12px;
    color: var(--text3);
  }

  .bar {
    width: 3px;
    border-radius: 2px;
    background: rgba(230,57,70,0.25);
    height: 4px;
    transition: height 0.08s ease;
  }

  /* ── Record controls ── */
  .controls {
    margin: 20px 20px 0;
    display: grid;
    grid-template-columns: 1fr 88px 1fr;
    align-items: center;
    gap: 12px;
  }

  .btn-side {
    height: 52px;
    border-radius: 14px;
    border: 0.5px solid var(--border2);
    background: var(--surface);
    color: var(--text2);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.18s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    touch-action: manipulation;
  }
  .btn-side:active { transform: scale(0.96); background: var(--surface2); }
  .btn-side:disabled { opacity: 0.3; pointer-events: none; }

  .btn-rec {
    width: 88px; height: 88px;
    border-radius: 50%;
    border: none;
    background: var(--red);
    color: white;
    font-size: 26px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 24px var(--red-glow);
    transition: all 0.2s;
    touch-action: manipulation;
    position: relative;
  }
  .btn-rec:active { transform: scale(0.93); }
  .btn-rec.recording {
    background: var(--surface2);
    border: 2.5px solid var(--red);
    box-shadow: 0 0 0 0 var(--red-glow);
    animation: ripple 1.8s linear infinite;
  }
  @keyframes ripple {
    0%  { box-shadow: 0 0 0 0px rgba(230,57,70,0.35); }
    100%{ box-shadow: 0 0 0 20px rgba(230,57,70,0); }
  }

  .stop-sq {
    width: 24px; height: 24px;
    background: var(--red);
    border-radius: 5px;
  }

  /* ── Sections ── */
  .section { margin: 20px 20px 0; }

  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .sec-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--text3);
    text-transform: uppercase;
  }

  .icon-btn {
    padding: 5px 12px;
    border-radius: 8px;
    border: 0.5px solid var(--border2);
    background: var(--surface);
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.18s;
    touch-action: manipulation;
  }
  .icon-btn:active { background: var(--surface2); }

  .transcript-area {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    min-height: 160px;
    max-height: 300px;
    overflow-y: auto;
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
    -webkit-overflow-scrolling: touch;
  }
  .transcript-area:empty::before {
    content: '録音すると、ここにリアルタイムで文字が表示されます';
    color: var(--text3);
    font-size: 13px;
  }
  .interim { color: var(--text2); font-style: italic; }

  .note-area {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    width: 100%;
    min-height: 90px;
    resize: none;
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    font-family: inherit;
    outline: none;
    -webkit-appearance: none;
  }
  .note-area::placeholder { color: var(--text3); }
  .note-area:focus { border-color: var(--border2); }

  /* ── Warning ── */
  .warn {
    margin: 16px 20px 0;
    padding: 14px 16px;
    background: rgba(230,57,70,0.08);
    border: 0.5px solid rgba(230,57,70,0.3);
    border-radius: 14px;
    font-size: 13px;
    color: #ff8a8a;
    line-height: 1.7;
    display: none;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">🎙</div>
    <h1>講義レコーダー</h1>
    <span class="header-date" id="hdate"></span>
  </header>

  <div class="lang-row">
    <button class="lang-btn active" data-lang="ja-JP">🇯🇵 日本語</button>
    <button class="lang-btn" data-lang="en-US">🇺🇸 English</button>
    <button class="lang-btn" data-lang="zh-CN">🇨🇳 中文</button>
  </div>

  <div class="status-card">
    <div class="dot idle" id="dot"></div>
    <div class="status-info">
      <div class="status-label" id="slabel">準備完了</div>
      <div class="status-sub"  id="ssub">録音ボタンをタップしてください</div>
    </div>
    <div class="timer" id="timer">00:00</div>
  </div>

  <div class="waveform" id="waveform">
    <span class="hint">波形はここに表示されます</span>
  </div>

  <div class="controls">
    <button class="btn-side" id="btn-pause" disabled>⏸ 一時停止</button>
    <button class="btn-rec"  id="btn-rec">🎙</button>
    <button class="btn-side" id="btn-clear" disabled>🗑 クリア</button>
  </div>

  <div class="warn" id="warn"></div>

  <div class="section">
    <div class="sec-head">
      <span class="sec-title">文字起こし</span>
      <button class="icon-btn" id="btn-copy">コピー</button>
    </div>
    <div class="transcript-area" id="transcript"></div>
  </div>

  <div class="section">
    <div class="sec-head">
      <span class="sec-title">メモ</span>
    </div>
    <textarea class="note-area" id="notes" placeholder="補足メモを自由に入力..."></textarea>
  </div>

</div>

<script>
  const $  = id => document.getElementById(id);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // Date
  const d = new Date();
  $('hdate').textContent = `${d.getMonth()+1}/${d.getDate()}`;

  if (!SR) {
    const w = $('warn');
    w.style.display = 'block';
    w.textContent = '⚠️ このブラウザはWeb Speech APIに対応していません。Chrome または Safari（iOS 15+）をお使いください。';
  }

  let rec = null;
  let isRec = false, isPaused = false;
  let finalText = '';
  let lang = 'ja-JP';
  let secs = 0, timerIv = null;
  let bars = [], animId = null;
  let audioCtx = null, analyser = null, src = null, micStream = null;

  // ── Waveform setup ──────────────────────
  function buildBars() {
    const wf = $('waveform');
    wf.innerHTML = '';
    bars = [];
    const w = wf.offsetWidth - 28;
    const n = Math.max(20, Math.floor(w / 6));
    for (let i = 0; i < n; i++) {
      const b = document.createElement('div');
      b.className = 'bar';
      wf.appendChild(b);
      bars.push(b);
    }
  }

  function drawBars() {
    if (!analyser) return;
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    const step = Math.floor(data.length / bars.length);
    bars.forEach((b, i) => {
      const v = data[i * step] || 0;
      const h = Math.max(4, (v / 255) * 46);
      b.style.height = h + 'px';
      b.style.background = `rgba(230,57,70,${0.18 + (v/255)*0.82})`;
    });
    animId = requestAnimationFrame(drawBars);
  }

  function resetBars() {
    cancelAnimationFrame(animId);
    bars.forEach(b => { b.style.height = '4px'; b.style.background = 'rgba(230,57,70,0.2)'; });
  }

  async function startViz() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      src = audioCtx.createMediaStreamSource(micStream);
      src.connect(analyser);
      buildBars();
      drawBars();
    } catch(e) { /* マイク拒否など */ }
  }

  function stopViz() {
    cancelAnimationFrame(animId);
    if (src)       { src.disconnect(); src = null; }
    if (audioCtx)  { audioCtx.close(); audioCtx = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    analyser = null;
    resetBars();
    buildBars();
  }

  // ── Timer ──────────────────────────────
  function startTimer() {
    secs = 0;
    clearInterval(timerIv);
    timerIv = setInterval(() => {
      if (!isPaused) {
        secs++;
        const m = String(Math.floor(secs/60)).padStart(2,'0');
        const s = String(secs % 60).padStart(2,'0');
        $('timer').textContent = `${m}:${s}`;
      }
    }, 1000);
  }
  function stopTimer() {
    clearInterval(timerIv);
    secs = 0;
    $('timer').textContent = '00:00';
  }

  // ── Status helper ──────────────────────
  function setStatus(state) {
    const dot   = $('dot');
    const label = $('slabel');
    const sub   = $('ssub');
    const timer = $('timer');
    const bRec  = $('btn-rec');
    const bPause= $('btn-pause');
    const bClear= $('btn-clear');

    dot.className = 'dot';
    if (state === 'idle') {
      dot.classList.add('idle');
      label.textContent = '準備完了';
      sub.textContent   = '録音ボタンをタップしてください';
      timer.classList.remove('show');
      bRec.className  = 'btn-rec';
      bRec.innerHTML  = '🎙';
      bPause.disabled = true;
      bPause.textContent = '⏸ 一時停止';
      bClear.disabled = (finalText === '');
      resetBars(); buildBars();
    } else if (state === 'rec') {
      dot.classList.add('rec');
      label.textContent = '録音中';
      sub.textContent   = 'リアルタイムで文字起こし中…';
      timer.classList.add('show');
      bRec.className  = 'btn-rec recording';
      bRec.innerHTML  = '<div class="stop-sq"></div>';
      bPause.disabled = false;
      bPause.textContent = '⏸ 一時停止';
    } else if (state === 'paused') {
      dot.classList.add('paused');
      label.textContent = '一時停止中';
      sub.textContent   = 'タップして再開';
      bPause.textContent = '▶ 再開';
      resetBars();
    }
  }

  // ── Recognition ───────────────────────
  function makeRec() {
    if (!SR) return null;
    const r = new SR();
    r.lang = lang;
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t;
        else interim += t;
      }
      $('transcript').innerHTML =
        finalText.replace(/\n/g,'<br>') +
        (interim ? `<span class="interim">${interim}</span>` : '');
      const ta = $('transcript');
      ta.scrollTop = ta.scrollHeight;
      $('btn-clear').disabled = false;
    };

    r.onerror = e => {
      if (e.error === 'not-allowed') {
        showWarn('マイクへのアクセスが拒否されました。ブラウザの設定を確認してください。');
        stop();
      }
    };

    r.onend = () => {
      if (isRec && !isPaused) {
        try { r.start(); } catch(_) {}
      }
    };
    return r;
  }

  function showWarn(msg) {
    const w = $('warn');
    w.textContent = '⚠️ ' + msg;
    w.style.display = 'block';
  }
  function hideWarn() {
    $('warn').style.display = 'none';
  }

  async function start() {
    hideWarn();
    rec = makeRec();
    if (!rec) return;
    isRec = true; isPaused = false;
    try {
      rec.start();
    } catch(e) { showWarn('録音を開始できませんでした: ' + e.message); isRec = false; return; }
    await startViz();
    setStatus('rec');
    startTimer();
  }

  function stop() {
    isRec = false; isPaused = false;
    if (rec) { rec.stop(); rec = null; }
    stopTimer();
    stopViz();
    setStatus('idle');
  }

  // ── Buttons ────────────────────────────
  $('btn-rec').addEventListener('click', () => {
    if (!isRec) start();
    else         stop();
  });

  $('btn-pause').addEventListener('click', () => {
    if (!isRec) return;
    isPaused = !isPaused;
    if (isPaused) {
      rec.stop();
      setStatus('paused');
    } else {
      try { rec.start(); } catch(_) {}
      setStatus('rec');
      drawBars();
    }
  });

  $('btn-clear').addEventListener('click', () => {
    if (!confirm('文字起こしをクリアしますか？')) return;
    finalText = '';
    $('transcript').innerHTML = '';
    $('btn-clear').disabled = true;
  });

  $('btn-copy').addEventListener('click', () => {
    if (!finalText) return;
    navigator.clipboard.writeText(finalText).then(() => {
      const b = $('btn-copy');
      const orig = b.textContent;
      b.textContent = '✓ コピー完了';
      setTimeout(() => b.textContent = orig, 1600);
    }).catch(() => {
      // fallback
      const el = document.createElement('textarea');
      el.value = finalText;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
    });
  });

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (isRec) return;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      lang = btn.dataset.lang;
    });
  });

  window.addEventListener('load', () => {
    buildBars();
  });
</script>
</body>
</html>
